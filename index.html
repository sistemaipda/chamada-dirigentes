<!DOCTYPE html><html lang="pt-br"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chamada de Dirigentes</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f3f5f8;margin:0;padding:10px;color:#222}
.logo{text-align:center;margin-bottom:15px}.logo img{width:100%;max-width:957px}
.topo{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff;padding:18px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 8px #0002}
.topo h2{margin:10px 0 5px}.btn{border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer}.voltar{width:100%;background:#fff;color:#0d47a1}
.pesquisa{width:100%;padding:15px;font-size:16px;border-radius:12px;border:1px solid #ddd;margin-bottom:12px}
.resumo,.aviso{background:#fff;padding:13px;border-radius:10px;margin-bottom:10px;font-weight:bold;text-align:center}
.aviso{background:#e8f5e9;color:#2e7d32}.bloqueado{background:#ffebee;color:#c62828}
.lista{overflow:hidden;border-radius:12px;box-shadow:0 2px 8px #0001}.card{background:#fff;padding:16px;border-bottom:1px solid #eee}
.igreja{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}.codigo{background:#0d47a1;color:#fff;padding:7px 9px;border-radius:8px;font-size:13px;font-weight:bold}
.nome{font-size:16px;font-weight:bold;line-height:1.3}.form{display:grid;grid-template-columns:1fr 190px;gap:10px}
.campo{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}.salvar{width:100%;margin-top:10px;background:#2e7d32;color:#fff}
.mensagem{text-align:center;color:#2e7d32;font-size:13px;font-weight:bold;display:none;margin-top:7px}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0d47a1,#1565c0);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.loginbox{background:#fff;width:100%;max-width:390px;padding:28px;border-radius:18px;text-align:center;box-shadow:0 10px 35px #0004}.loginbox h2{color:#0d47a1}
.loginbox input{width:100%;padding:15px;border:1px solid #ddd;border-radius:10px;text-align:center;font-size:18px;letter-spacing:3px}.entrar{width:100%;background:#0d47a1;color:#fff;margin-top:10px}
.erro{color:#c62828;font-weight:bold;min-height:20px;margin-top:10px}@media(max-width:600px){.form{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script></head><body>

<div id="login" class="login"><div class="loginbox"><h2>Chamada de Dirigentes</h2>
<p>Digite a senha para acessar o portal.</p><input id="senha" type="password" inputmode="numeric" placeholder="Senha">
<button class="btn entrar" onclick="entrar()">Acessar portal</button><div id="erro" class="erro"></div></div></div>

<div class="logo"><img src="logo-ipda.png" alt="Logo IPDA"></div>
<div class="topo"><button class="btn voltar" onclick="location.href='https://www.sitesetorialcontagem.com.br'">← Voltar ao Site</button>
<h2>Chamada de Dirigentes</h2><div id="data"></div></div>
<div id="estado"></div><div id="conteudo" style="display:none">
<input id="pesquisa" class="pesquisa" placeholder="🔍 Pesquisar igreja ou código..." onkeyup="filtrar()">
<div class="resumo" id="resumo"></div><div class="lista" id="lista"></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDa54rKMs0EYUTCKt4rPBU2fz3HjXd8eVQ",
  authDomain: "chamada-dirigentes.firebaseapp.com",
  databaseURL: "https://chamada-dirigentes-default-rtdb.firebaseio.com",
  projectId: "chamada-dirigentes",
  storageBucket: "chamada-dirigentes.firebasestorage.app",
  messagingSenderId: "7168188388",
  appId: "1:7168188388:web:fd2976fff907bdf493b1f1",
  measurementId: "G-E2FSF0W7ZD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const igrejas = [
{codigo:"10277",nome:"IPDA CONTAGEM ELDORADO"},
{codigo:"10336",nome:"IPDA JARDIM RIACHO (RIO POTI)"},
{codigo:"10341",nome:"IPDA PARQUE SÃO JOÃO"},
{codigo:"11804",nome:"IPDA JARDIM MARACANÃ"},
{codigo:"11792",nome:"IPDA MARIA DA CONCEIÇÃO"},
{codigo:"11786",nome:"IPDA BERNARDO MONTEIRO"},
{codigo:"11790",nome:"IPDA FUNCIONÁRIOS"},
{codigo:"11788",nome:"IPDA CANADÁ"},
{codigo:"11795",nome:"IPDA VILA ITÁLIA"},
{codigo:"11798",nome:"IPDA SANTA HELENA"},
{codigo:"18167",nome:"IPDA COLONIAL"},
{codigo:"11791",nome:"IPDA JARDIM MARROCOS"},
{codigo:"11796",nome:"IPDA PRAIA"},
{codigo:"11785",nome:"IPDA BELA VISTA"},
{codigo:"11797",nome:"IPDA CHÁCARAS DEL REY"},
{codigo:"10319",nome:"IPDA JARDIM DOS BANDEIRANTES"},
{codigo:"10334",nome:"IPDA NOVO ELDORADO"},
{codigo:"10324",nome:"IPDA INCONFIDENTES"},
{codigo:"18271",nome:"IPDA ELDORADO II (JOÃO GOMES CARDOSO)"},
{codigo:"10363",nome:"IPDA SANTA CRUZ INDUSTRIAL"},
{codigo:"10277",nome:"IPDA ELDORADO IV (FIRMO DE MATOS)"}
];
const SENHA_PORTAL="86432568";let controle={aberto:false,encerrado:false};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function chave(i){return i.codigo+"_"+i.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_")}
function entrar(){if(document.getElementById("senha").value===SENHA_PORTAL){document.getElementById("login").style.display="none";document.getElementById("conteudo").style.display="block";iniciar()}else document.getElementById("erro").innerText="Senha incorreta."}
document.getElementById("senha").addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});
function iniciar(){document.getElementById("data").innerText=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});montar();
db.ref("chamadaDirigentesControle").on("value",s=>{controle=s.val()||{aberto:false,encerrado:false};estado()});
db.ref("chamadaDirigentes").on("value",carregar)}
function montar(){let h="";igrejas.forEach((i,n)=>{h+=`<div class="card item" data-nome="${esc(i.nome).toLowerCase()}" data-codigo="${i.codigo}">
<div class="igreja"><div class="codigo">${i.codigo}</div><div class="nome">${esc(i.nome)}</div></div>
<div class="form"><input class="campo" id="nome_${n}" placeholder="Nome do dirigente"><select class="campo" id="pastor_${n}">
<option value="">Selecione...</option><option value="Primeiro Pastor">1º Pastor</option><option value="Segundo Pastor">2º Pastor</option></select></div>
<button class="btn salvar" onclick="salvar(${n})">💾 Salvar chamada</button><div class="mensagem" id="msg_${n}">✓ Chamada registrada</div></div>`});document.getElementById("lista").innerHTML=h}
function estado(){let e=document.getElementById("estado");if(controle.encerrado){e.innerHTML='<div class="aviso bloqueado">🔒 O preenchimento foi encerrado pelo administrador.</div>'}else if(!controle.aberto){e.innerHTML='<div class="aviso bloqueado">⏳ O preenchimento ainda não foi liberado. Aguarde o responsável.</div>'}else{e.innerHTML='<div class="aviso">🟢 Preenchimento liberado.</div>'}}
function salvar(n){if(!controle.aberto||controle.encerrado){alert("O preenchimento não está liberado.");return}let i=igrejas[n],nome=document.getElementById("nome_"+n).value.trim(),pastor=document.getElementById("pastor_"+n).value;
if(!nome){alert("Digite o nome do dirigente.");return}if(!pastor){alert("Selecione 1º ou 2º Pastor.");return}
db.ref("chamadaDirigentes/"+chave(i)).set({codigo:i.codigo,igreja:i.nome,dirigente:nome,pastor:pastor,atualizadoEm:new Date().toISOString()}).then(()=>{let m=document.getElementById("msg_"+n);m.style.display="block";setTimeout(()=>m.style.display="none",3000)})}
function carregar(s){let d=s.val()||{};igrejas.forEach((i,n)=>{let r=d[chave(i)];if(r){document.getElementById("nome_"+n).value=r.dirigente||"";document.getElementById("pastor_"+n).value=r.pastor||""}});let p=igrejas.filter((i,n)=>document.getElementById("nome_"+n).value.trim()&&document.getElementById("pastor_"+n).value).length;document.getElementById("resumo").innerHTML=`Igrejas: ${igrejas.length} &nbsp;|&nbsp; Preenchidas: ${p}`}
function filtrar(){let f=document.getElementById("pesquisa").value.toLowerCase().trim();document.querySelectorAll(".item").forEach(x=>x.style.display=x.dataset.nome.includes(f)||x.dataset.codigo.includes(f)?"block":"none")}
</script></body></html>
