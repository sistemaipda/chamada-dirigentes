<!DOCTYPE html><html lang="pt-br"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Painel Administrativo</title>
<style>
html,body{-webkit-touch-callout:none}img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}
*{box-sizing:border-box}body{font-family:Arial;background:#f3f5f8;margin:0;padding:10px}.container{max-width:1050px;margin:auto}
.topo{background:linear-gradient(135deg,#0d47a1,#1565c0);color:#fff;padding:20px;border-radius:15px;margin-bottom:15px}.topo h1{margin:5px 0}
.painel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.caixa,.acoes,.tabela{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}
.caixa{text-align:center}.caixa strong{display:block;font-size:28px;color:#0d47a1;margin-top:5px}.acoes{margin-bottom:15px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:bold;cursor:pointer;margin:4px}.abrir{background:#2e7d32;color:#fff}.limparTudo{background:#6a1b9a;color:#fff}.encerrar{background:#c62828;color:#fff}.reabrir{background:#ef6c00;color:#fff}
.status{padding:13px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:15px}.aberto{background:#e8f5e9;color:#2e7d32}.fechado{background:#ffebee;color:#c62828}
.tabela{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#0d47a1;color:#fff;padding:13px;text-align:left}td{padding:13px;border-bottom:1px solid #eee}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#082d6b,#1565c0);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.loginbox{background:#fff;max-width:400px;width:100%;padding:30px 26px;border-radius:22px;text-align:center;box-shadow:0 15px 45px #0005}
.loginlogo{width:145px;height:145px;object-fit:contain;border-radius:18px;margin:0 auto 12px;display:block;box-shadow:0 3px 15px #0002}
.loginbox h2{color:#0d47a1;margin:8px 0 4px;font-size:24px}.loginbox p{color:#666;margin:5px 0 18px}
.senha-wrap{position:relative;width:100%;margin-bottom:10px}.senha-wrap input{width:100%;height:54px;padding:15px 52px 15px 16px;border:2px solid #d5dbe5;border-radius:12px;text-align:center;font-size:18px;letter-spacing:3px;outline:none}.senha-wrap input:focus{border-color:#0d47a1;box-shadow:0 0 0 3px #0d47a120}
.icone-senha{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:25px;height:25px;object-fit:contain;opacity:.75}
.entrar{width:100%;background:#0d47a1;color:#fff;margin-top:2px;height:50px}.loginrodape{font-size:12px!important;color:#777!important;margin:15px 0 0!important;font-weight:bold}
.erro{color:#c62828;font-weight:bold;min-height:20px;margin-top:10px}
@media(max-width:650px){.painel{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script></head><body>

<div id="login" class="login"><div class="loginbox">
<img src="../logo.jpg" class="loginlogo" alt="Sistema IPDA" draggable="false" oncontextmenu="return false">
<h2>Painel Administrativo</h2><p>Chamada de Dirigentes</p>
<div class="senha-wrap"><input id="senha" type="password" inputmode="numeric" placeholder="Senha" autocomplete="current-password"><img src="../icone-senha.jpg" class="icone-senha" alt="" draggable="false" oncontextmenu="return false"></div>
<button class="btn entrar" onclick="entrar()">Entrar</button>
<p class="loginrodape">Sistema Administrativo IPDA Setorial Contagem</p>
<div id="erro" class="erro"></div></div></div>

<div id="app" class="container" style="display:none"><div class="topo"><h1>⚙️ Painel Administrativo</h1><div>Chamada de Dirigentes</div></div>
<div id="status" class="status"></div><div class="painel">
<div class="caixa">Total de igrejas<strong id="total">0</strong></div><div class="caixa">Preenchidas<strong id="preenchidas">0</strong></div><div class="caixa">Pendentes<strong id="pendentes">0</strong></div></div>
<div class="acoes"><button class="btn abrir" onclick="abrir()">🟢 Liberar preenchimento</button><button class="btn encerrar" onclick="encerrar()">🔴 Encerrar preenchimento</button><button class="btn reabrir" onclick="reabrir()">🔄 Reabrir</button><button class="btn limparTudo" onclick="limparTudo()">🧹 Limpar tudo</button><button class="btn" onclick="location.href='../'">← Portal</button></div>
<div class="tabela"><table><thead><tr><th>Código</th><th>Igreja</th><th>Dirigente</th><th>Pastor</th><th>Atualização</th><th>Ação</th></tr></thead><tbody id="tabela"></tbody></table></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDa54rKMs0EYUTCKt4rPBU2fz3HjXd8eVQ",
  authDomain: "chamada-dirigentes.firebaseapp.com",
  databaseURL: "https://chamada-dirigentes-default-rtdb.firebaseio.com",
  projectId: "chamada-dirigentes",
  storageBucket: "chamada-dirigentes.firebasestorage.app",
  messagingSenderId: "7168188388",
  appId: "1:7168188388:web:fd2976fff907bdf493b1f1",
  measurementId: "G-E2FSF0W7ZD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const igrejas = [
{codigo:"10277",nome:"IPDA CONTAGEM ELDORADO"},
{codigo:"10336",nome:"IPDA JARDIM RIACHO (RIO POTI)"},
{codigo:"10341",nome:"IPDA PARQUE SÃO JOÃO"},
{codigo:"11804",nome:"IPDA JARDIM MARACANÃ"},
{codigo:"11792",nome:"IPDA MARIA DA CONCEIÇÃO"},
{codigo:"11786",nome:"IPDA BERNARDO MONTEIRO"},
{codigo:"11790",nome:"IPDA FUNCIONÁRIOS"},
{codigo:"11788",nome:"IPDA CANADÁ"},
{codigo:"11795",nome:"IPDA VILA ITÁLIA"},
{codigo:"11798",nome:"IPDA SANTA HELENA"},
{codigo:"18167",nome:"IPDA COLONIAL"},
{codigo:"11791",nome:"IPDA JARDIM MARROCOS"},
{codigo:"11796",nome:"IPDA PRAIA"},
{codigo:"11785",nome:"IPDA BELA VISTA"},
{codigo:"11797",nome:"IPDA CHÁCARAS DEL REY"},
{codigo:"10319",nome:"IPDA JARDIM DOS BANDEIRANTES"},
{codigo:"10334",nome:"IPDA NOVO ELDORADO"},
{codigo:"10324",nome:"IPDA INCONFIDENTES"},
{codigo:"18271",nome:"IPDA ELDORADO II (JOÃO GOMES CARDOSO)"},
{codigo:"10363",nome:"IPDA SANTA CRUZ INDUSTRIAL"},
{codigo:"10277",nome:"IPDA ELDORADO IV (FIRMO DE MATOS)"}
];
const SENHA_ADMIN="86432568";
function chave(i){return i.codigo+"_"+i.nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"_")}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function mostrarAdmin(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";iniciar()}
function entrar(){if(document.getElementById("senha").value===SENHA_ADMIN){sessionStorage.setItem("chamadaDirigentesAdminLogin","ok");mostrarAdmin()}else document.getElementById("erro").innerText="Senha incorreta."}
document.getElementById("senha").addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});
document.addEventListener("contextmenu",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
if(sessionStorage.getItem("chamadaDirigentesAdminLogin")==="ok")mostrarAdmin();
function iniciar(){db.ref("chamadaDirigentesControle").on("value",s=>{let c=s.val()||{aberto:false,encerrado:false};let e=document.getElementById("status");if(c.encerrado){e.className="status fechado";e.innerText="🔴 PREENCHIMENTO ENCERRADO"}else if(c.aberto){e.className="status aberto";e.innerText="🟢 PREENCHIMENTO LIBERADO"}else{e.className="status fechado";e.innerText="⏳ PREENCHIMENTO NÃO LIBERADO"}});db.ref("chamadaDirigentes").on("value",render)}
function setControle(v){return db.ref("chamadaDirigentesControle").set({...v,atualizadoEm:new Date().toISOString()})}
function abrir(){if(confirm("Liberar o preenchimento da chamada?"))setControle({aberto:true,encerrado:false})}
function encerrar(){if(confirm("Encerrar o preenchimento? Ninguém poderá alterar pelo portal."))setControle({aberto:false,encerrado:true})}
function reabrir(){if(confirm("Reabrir o preenchimento?"))setControle({aberto:true,encerrado:false})}
function render(s){let d=s.val()||{},p=0,h="";igrejas.forEach(i=>{let r=d[chave(i)];if(r){p++;h+=`<tr><td><b>${esc(i.codigo)}</b></td><td>${esc(i.nome)}</td><td>${esc(r.dirigente)}</td><td>${esc(r.pastor)}</td><td>${r.atualizadoEm?new Date(r.atualizadoEm).toLocaleString("pt-BR"):"-"}</td><td><button class="btn limparLinha" onclick="limpar('${chave(i)}','${esc(i.nome).replace(/'/g,"\\'")}')">🧹 Limpar</button></td></tr>`}else h+=`<tr><td><b>${esc(i.codigo)}</b></td><td>${esc(i.nome)}</td><td colspan="2">— Não preenchido —</td><td>—</td><td><button class="btn limparLinha" disabled>🧹 Limpar</button></td></tr>`});document.getElementById("tabela").innerHTML=h;document.getElementById("total").innerText=igrejas.length;document.getElementById("preenchidas").innerText=p;document.getElementById("pendentes").innerText=igrejas.length-p}
function limpar(id,nome){if(confirm("Limpar o preenchimento de "+nome+"?\\n\\nA igreja ficará disponível para ser preenchida novamente.")){db.ref("chamadaDirigentes/"+id).remove().then(()=>alert("✅ Preenchimento limpo. A igreja está disponível novamente.")).catch(err=>alert("❌ Não foi possível limpar.\\n\\n"+err.message))}}
function limparTudo(){if(confirm("ATENÇÃO!\\n\\nIsso vai apagar TODOS os preenchimentos da chamada.\\nAs igrejas ficarão disponíveis para serem preenchidas novamente.\\n\\nDeseja realmente limpar tudo?")){db.ref("chamadaDirigentes").remove().then(()=>alert("✅ Todos os preenchimentos foram limpos.")).catch(err=>alert("❌ Não foi possível limpar tudo.\\n\\n"+err.message))}}
</script></body></html>
